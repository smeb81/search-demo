<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Meridian - Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }
        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }
        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }
        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }
        .color-group { margin-bottom: 16px; }
        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }
        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Digital Meridian</h1>
            <div class="subtitle">Blue gradient · Circular symmetry · Minimalist tech</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Ring Count</label>
                    <div class="slider-container">
                        <input type="range" id="ringCount" min="3" max="20" step="1" value="8" oninput="updateParam('ringCount', this.value)">
                        <span class="value-display" id="ringCount-value">8</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Symmetry</label>
                    <div class="slider-container">
                        <input type="range" id="symmetry" min="6" max="24" step="2" value="12" oninput="updateParam('symmetry', this.value)">
                        <span class="value-display" id="symmetry-value">12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Line Density</label>
                    <div class="slider-container">
                        <input type="range" id="lineDensity" min="0.3" max="1.5" step="0.1" value="0.8" oninput="updateParam('lineDensity', this.value)">
                        <span class="value-display" id="lineDensity-value">0.8</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Stroke Weight</label>
                    <div class="slider-container">
                        <input type="range" id="strokeWeight" min="0.5" max="3" step="0.25" value="1.5" oninput="updateParam('strokeWeight', this.value)">
                        <span class="value-display" id="strokeWeight-value">1.5</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Deep Blue (Center)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#1a365d" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#1a365d</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Mid Blue</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#2b6cb0" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#2b6cb0</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Cyan (Edge)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#81e6d9" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#81e6d9</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            ringCount: 8,
            symmetry: 12,
            lineDensity: 0.8,
            strokeWeight: 1.5,
            colorPalette: ['#1a365d', '#2b6cb0', '#81e6d9']
        };

        let defaultParams = {...params};

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            background(250, 249, 245);
            drawPattern();
        }

        function drawPattern() {
            let centerX = width / 2;
            let centerY = height / 2;
            let maxRadius = min(width, height) * 0.42;
            let ringSpacing = maxRadius / params.ringCount;

            // Draw concentric rings with geometric patterns
            for (let ring = 1; ring <= params.ringCount; ring++) {
                let radius = ring * ringSpacing;
                let progress = ring / params.ringCount;

                // Get color based on position
                let col = getGradientColor(progress);

                // Draw ring segments
                stroke(col);
                strokeWeight(params.strokeWeight);
                noFill();

                let segments = params.symmetry;
                let segmentLength = TWO_PI / segments * params.lineDensity;

                for (let i = 0; i < segments; i++) {
                    let startAngle = (TWO_PI / segments) * i;
                    let endAngle = startAngle + segmentLength;

                    // Main arc
                    arc(centerX, centerY, radius * 2, radius * 2, startAngle, endAngle);

                    // Add decorative dots at segment ends
                    let dotRadius = radius - 2;
                    let x1 = centerX + cos(startAngle) * dotRadius;
                    let y1 = centerY + sin(startAngle) * dotRadius;
                    let x2 = centerX + cos(endAngle) * dotRadius;
                    let y2 = centerY + sin(endAngle) * dotRadius;

                    fill(col);
                    noStroke();
                    circle(x1, y1, params.strokeWeight * 1.5);
                    circle(x2, y2, params.strokeWeight * 1.5);
                    noFill();
                }
            }

            // Draw radiating lines from center
            stroke(params.colorPalette[0]);
            strokeWeight(params.strokeWeight * 0.5);

            for (let i = 0; i < params.symmetry; i++) {
                let angle = (TWO_PI / params.symmetry) * i;
                let x1 = centerX + cos(angle) * maxRadius * 0.15;
                let y1 = centerY + sin(angle) * maxRadius * 0.15;
                let x2 = centerX + cos(angle) * maxRadius;
                let y2 = centerY + sin(angle) * maxRadius;

                // Dashed line effect
                let dashes = 20;
                let dashColor = color(params.colorPalette[0]);
                for (let d = 0; d < dashes; d += 2) {
                    let t1 = d / dashes;
                    let t2 = (d + 1) / dashes;
                    let px1 = lerp(x1, x2, t1);
                    let py1 = lerp(y1, y2, t1);
                    let px2 = lerp(x1, x2, t2);
                    let py2 = lerp(y1, y2, t2);

                    let alpha = map(d, 0, dashes, 50, 200);
                    stroke(red(dashColor), green(dashColor), blue(dashColor), alpha);
                    line(px1, py1, px2, py2);
                }
            }

            // Center geometric element
            let centerCol = color(params.colorPalette[0]);
            fill(centerCol);
            noStroke();
            circle(centerX, centerY, maxRadius * 0.2);

            // Inner rings at center
            stroke(centerCol);
            noFill();
            for (let r = 1; r <= 3; r++) {
                circle(centerX, centerY, maxRadius * 0.1 * r);
            }

            // Add subtle geometric accents between rings
            for (let ring = 1; ring < params.ringCount; ring++) {
                let radius = ring * ringSpacing + ringSpacing / 2;
                let progress = ring / params.ringCount;
                let col = getGradientColor(progress);
                stroke(red(col), green(col), blue(col), 80);
                strokeWeight(0.5);

                // Small markers at symmetry points
                for (let i = 0; i < params.symmetry; i += 2) {
                    let angle = (TWO_PI / params.symmetry) * i;
                    let x = centerX + cos(angle) * radius;
                    let y = centerY + sin(angle) * radius;
                    circle(x, y, 2);
                }
            }
        }

        function getGradientColor(t) {
            // Interpolate between three blue tones
            let c1 = color(params.colorPalette[0]);
            let c2 = color(params.colorPalette[1]);
            let c3 = color(params.colorPalette[2]);

            let result;
            if (t < 0.5) {
                result = lerpColor(c1, c2, t * 2);
            } else {
                result = lerpColor(c2, c3, (t - 0.5) * 2);
            }
            return result;
        }

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            initializeSystem();
        }

        function updateColor(colorId, value) {
            let index = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[index] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};

            document.getElementById('ringCount').value = params.ringCount;
            document.getElementById('ringCount-value').textContent = params.ringCount;
            document.getElementById('symmetry').value = params.symmetry;
            document.getElementById('symmetry-value').textContent = params.symmetry;
            document.getElementById('lineDensity').value = params.lineDensity;
            document.getElementById('lineDensity-value').textContent = params.lineDensity;
            document.getElementById('strokeWeight').value = params.strokeWeight;
            document.getElementById('strokeWeight-value').textContent = params.strokeWeight;

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
