<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aureus Fractum - Golden Fractal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }
        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }
        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }
        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }
        .color-group { margin-bottom: 16px; }
        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }
        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Aureus Fractum</h1>
            <div class="subtitle">Golden fractal · Recursive symmetry · Metallic elegance</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Recursion Depth</label>
                    <div class="slider-container">
                        <input type="range" id="recursionDepth" min="3" max="6" step="1" value="5" oninput="updateParam('recursionDepth', this.value)">
                        <span class="value-display" id="recursionDepth-value">5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Symmetry</label>
                    <div class="slider-container">
                        <input type="range" id="symmetry" min="6" max="16" step="2" value="12" oninput="updateParam('symmetry', this.value)">
                        <span class="value-display" id="symmetry-value">12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Branch Angle</label>
                    <div class="slider-container">
                        <input type="range" id="branchAngle" min="0.2" max="0.8" step="0.05" value="0.45" oninput="updateParam('branchAngle', this.value)">
                        <span class="value-display" id="branchAngle-value">0.45</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Length Ratio</label>
                    <div class="slider-container">
                        <input type="range" id="lengthRatio" min="0.5" max="0.8" step="0.02" value="0.65" oninput="updateParam('lengthRatio', this.value)">
                        <span class="value-display" id="lengthRatio-value">0.65</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Complexity</label>
                    <div class="slider-container">
                        <input type="range" id="complexity" min="0.3" max="1.0" step="0.1" value="0.7" oninput="updateParam('complexity', this.value)">
                        <span class="value-display" id="complexity-value">0.7</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Deep Gold (Center)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#b8860b" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#b8860b</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Bright Gold</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#d4af37" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#d4af37</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Pale Gold (Edge)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#fff8dc" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#fff8dc</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            recursionDepth: 5,
            symmetry: 12,
            branchAngle: 0.45,
            lengthRatio: 0.65,
            complexity: 0.7,
            colorPalette: ['#b8860b', '#d4af37', '#fff8dc']
        };

        let defaultParams = {...params};
        let goldenAngle;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            goldenAngle = (1 + sqrt(5)) / 2;
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            background(250, 249, 245);
            drawGoldenFractal();
        }

        function drawGoldenFractal() {
            let centerX = width / 2;
            let centerY = height / 2;
            let maxRadius = min(width, height) * 0.42;

            // Draw central ornament
            drawCenterOrnament(centerX, centerY, maxRadius * 0.15);

            // Draw main fractal branches
            let branches = params.symmetry;
            let baseLength = maxRadius * 0.85;

            for (let i = 0; i < branches; i++) {
                let angle = (TWO_PI / branches) * i - HALF_PI;
                push();
                translate(centerX, centerY);
                rotate(angle);

                // Draw recursive branch
                drawBranch(baseLength, 0, params.recursionDepth);

                pop();
            }

            // Draw outer decorative ring
            drawOuterRing(centerX, centerY, maxRadius);
        }

        function drawCenterOrnament(cx, cy, radius) {
            // Multiple concentric circles with golden gradient
            for (let i = 5; i >= 1; i--) {
                let r = radius * (i / 5);
                let col = lerpColor(
                    color(params.colorPalette[0]),
                    color(params.colorPalette[1]),
                    i / 5
                );
                stroke(col);
                strokeWeight(map(i, 1, 5, 0.5, 2));
                noFill();
                circle(cx, cy, r * 2);
            }

            // Central star
            fill(params.colorPalette[1]);
            noStroke();
            let starPoints = 8;
            let innerR = radius * 0.3;
            let outerR = radius * 0.6;

            beginShape();
            for (let i = 0; i < starPoints * 2; i++) {
                let angle = (TWO_PI / (starPoints * 2)) * i - HALF_PI;
                let r = (i % 2 === 0) ? outerR : innerR;
                vertex(cx + cos(angle) * r, cy + sin(angle) * r);
            }
            endShape(CLOSE);
        }

        function drawBranch(len, depth, maxDepth) {
            if (depth > maxDepth || len < 3) return;

            // Calculate color based on depth
            let t = depth / maxDepth;
            let col;
            if (t < 0.5) {
                col = lerpColor(color(params.colorPalette[0]), color(params.colorPalette[1]), t * 2);
            } else {
                col = lerpColor(color(params.colorPalette[1]), color(params.colorPalette[2]), (t - 0.5) * 2);
            }

            // Stroke weight decreases with depth
            let sw = map(depth, 0, maxDepth, 3, 0.5);
            stroke(col);
            strokeWeight(sw);

            // Draw main branch
            line(0, 0, len, 0);

            // Move to end of branch
            translate(len, 0);

            // Calculate branching
            let nextLen = len * params.lengthRatio;
            let angleVar = params.branchAngle + (noise(depth * 100 + params.seed) - 0.5) * 0.3 * params.complexity;

            // Randomize which branches to draw based on complexity
            let numBranches = floor(random(2, 4));
            if (depth === 0) numBranches = 3;

            for (let b = 0; b < numBranches; b++) {
                let dir = (b === 0) ? -1 : (b === numBranches - 1 ? 1 : 0);

                if (dir === 0 && params.complexity < 0.5) continue;
                if (dir !== 0 || random() < params.complexity) {
                    push();
                    rotate(dir * angleVar + (noise(depth * 50 + b * 10 + params.seed) - 0.5) * 0.2 * params.complexity);
                    drawBranch(nextLen, depth + 1, maxDepth);
                    pop();
                }
            }

            // Secondary smaller branches
            if (depth < maxDepth - 1 && params.complexity > 0.4) {
                push();
                rotate(PI / 2);
                rotate((noise(depth * 30 + params.seed) - 0.5) * 0.5);
                drawBranch(nextLen * 0.5, depth + 2, maxDepth);
                pop();
            }
        }

        function drawOuterRing(cx, cy, radius) {
            noFill();
            strokeWeight(1);

            // Multiple rings at different radii
            let ringCount = 3;
            for (let r = 0; r < ringCount; r++) {
                let currentRadius = radius * (0.85 + r * 0.08);
                let col = lerpColor(
                    color(params.colorPalette[1]),
                    color(params.colorPalette[2]),
                    r / ringCount
                );
                stroke(red(col), green(col), blue(col), 150);

                // Draw dashed circle
                let dashes = params.symmetry * 4;
                for (let i = 0; i < dashes; i++) {
                    let startAngle = (TWO_PI / dashes) * i;
                    let endAngle = startAngle + (TWO_PI / dashes) * 0.4;
                    arc(cx, cy, currentRadius * 2, currentRadius * 2, startAngle, endAngle);
                }
            }

            // Small decorative dots at symmetry points
            for (let i = 0; i < params.symmetry; i++) {
                let angle = (TWO_PI / params.symmetry) * i - HALF_PI;
                let x = cx + cos(angle) * radius;
                let y = cy + sin(angle) * radius;

                fill(params.colorPalette[1]);
                noStroke();
                circle(x, y, 4);
            }
        }

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            initializeSystem();
        }

        function updateColor(colorId, value) {
            let index = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[index] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};

            document.getElementById('recursionDepth').value = params.recursionDepth;
            document.getElementById('recursionDepth-value').textContent = params.recursionDepth;
            document.getElementById('symmetry').value = params.symmetry;
            document.getElementById('symmetry-value').textContent = params.symmetry;
            document.getElementById('branchAngle').value = params.branchAngle;
            document.getElementById('branchAngle-value').textContent = params.branchAngle;
            document.getElementById('lengthRatio').value = params.lengthRatio;
            document.getElementById('lengthRatio-value').textContent = params.lengthRatio;
            document.getElementById('complexity').value = params.complexity;
            document.getElementById('complexity-value').textContent = params.complexity;

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
